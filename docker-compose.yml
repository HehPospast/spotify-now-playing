services:
  spotify:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      DATABASE_PATH: /data/state.sqlite3
    volumes:
      - spotify-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  spotify-data:
