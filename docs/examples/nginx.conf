# Include inside nginx's http context (for example, sites-enabled on Debian).
# nginx runs on the same host as the supplied Docker Compose application.
# Replace the domain and certificate paths; provision the certificate FIRST.
server {
    listen 80;
    server_name music.example.com;
    access_log off;
    return 308 https://music.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name music.example.com;

    ssl_certificate /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Do not record authorization codes or OAuth state from callback queries.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";

        # Covers the SSE endpoint as well as ordinary requests.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        gzip off;
    }
}
